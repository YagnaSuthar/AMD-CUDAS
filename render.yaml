services:
  - type: web
    name: cudas-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r app/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: CUDAS_ADMIN_EMAIL
        sync: false
      - key: CUDAS_ADMIN_PASSWORD
        sync: false
      - key: SKIP_EMBEDDING_WARMUP
        value: "true"
      - key: HF_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
